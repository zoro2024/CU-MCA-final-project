namespace: loglens

image: 432995435807.dkr.ecr.ap-south-1.amazonaws.com/cu-final/backend:latest
replicas: 1

# Secret configuration: by default expect an external Secret; set create=true to create it from values
secret:
  # Do not create secrets from values in Helm — use external Secret manifests (recommended for Argo CD)
  create: false
  name: loglens-secrets
  data: {}

# Resource requests/limits (optional)
resources: {}

# Service type (ClusterIP recommended)
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  # Ingress configuration for ALB (set enabled=true to create Ingress)
  className: alb
  name: loglens-backend-ingress
  host: loglens.dealshare.in
  path: /api
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: shared-alb
    alb.ingress.kubernetes.io/load-balancer-name: shared-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

# Optional migration Job (will run `init_db()` if enabled)
migrate:
  enabled: false
  # image to run migration; defaults to the backend image
  image: ""
  # extra command args appended to the python -c invocation
  command: []
