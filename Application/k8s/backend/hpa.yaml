apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loglens-backend-hpa
  namespace: loglens
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: loglens-backend
  
  minReplicas: 1 
  maxReplicas: 2 

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1 
          periodSeconds: 15
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min # 'Min' is safer for scale-down; it chooses the policy that changes the replica count the least
      policies:
        - type: Percent
          value: 25 # More gradual scale down for larger replica pools
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70