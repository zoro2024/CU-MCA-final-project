apiVersion: v1
kind: Secret
metadata:
  name: loglens-secrets
  namespace: loglens
type: Opaque
stringData:
  # Replace with your Gemini API key
  GEMINI_API_KEY: "replace-with-your-gemini-api-key" #https://aistudio.google.com/api-keys
  # Model to use (matches .env)
  GEMINI_MODEL: "gemini-2.5-flash-lite"
  # Base URL for Gemini/OpenAI-compatible endpoint
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  # Database and Redis connection strings
  DATABASE_URL: "postgresql+psycopg://loglens:Loglens-pass@postgres-postgresql.postgres.svc.cluster.local:5432/loglens"
  REDIS_URL: "redis://redis-master.redis.svc.cluster.local:6379"
# Usage:
# 1) Edit the file to fill in real values (or generate it via scripts).
# 2) Apply with kubectl so Helm can use the secret (keep secret.create=false):
#    kubectl apply -f Application/k8s/loglens-secrets.yaml
# 3) Install the chart without letting Helm create the secret:
#    helm upgrade --install loglens-backend ./helm/loglens-backend -n loglens --set secret.create=false
# Alternative (create from local .env):
#    kubectl create secret generic loglens-secrets -n loglens \
#      --from-literal=GEMINI_API_KEY='YOUR_KEY' \
#      --from-literal=GEMINI_MODEL='gemini-2.5-flash' \
#      --from-literal=GEMINI_BASE_URL='https://generativelanguage.googleapis.com/v1beta/openai/' \
#      --from-literal=DATABASE_URL='postgresql+psycopg://...' \
#      --from-literal=REDIS_URL='redis://...' \
#      --dry-run=client -o yaml | kubectl apply -f -
