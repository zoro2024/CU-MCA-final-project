apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: loglens-backend
  namespace: loglens

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loglens-backend

  template:
    metadata:
      labels:
        app: loglens-backend

    spec:
      containers:
        - name: backend
          image: 432995435807.dkr.ecr.ap-south-1.amazonaws.com/cu-final/backend:latest

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: loglens-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

  strategy:
    canary:
      stableService: loglens-backend-stable
      canaryService: loglens-backend-canary

      steps:
        - setWeight: 40
        - pause:
            duration: 2m

        - setWeight: 60
        - pause:
            duration: 2m

        - setWeight: 100