apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.job.name | default "loglens-migrate" }}
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.job.imageRepository }}:{{ .Values.job.imageTag }}
          command: ["/bin/sh", "-c"]
          args:
            - python -c "from app.db import init_db; init_db()"
          envFrom:
            - secretRef:
                name: loglens-secrets
