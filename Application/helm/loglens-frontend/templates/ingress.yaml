{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loglens-frontend
  namespace: {{ .Values.namespace }}
  annotations: {}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: loglens-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loglens-frontend
                port:
                  number: 80
{{- end }}
