{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: loglens-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: {{ if .Values.migrate.image }}{{ .Values.migrate.image }}{{ else }}{{ .Values.image }}{{ end }}
        command: ["/bin/sh","-c"]
        args:
          - |
            python -c "from app.db import init_db; init_db()"{{- if .Values.migrate.command }} {{ join " " .Values.migrate.command }}{{ end }}
        envFrom:
          - secretRef:
              name: {{ .Values.secret.name }}
  backoffLimit: 2
{{- end }}
