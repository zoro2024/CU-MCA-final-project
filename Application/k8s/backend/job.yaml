---
apiVersion: batch/v1
kind: Job
metadata:
  name: loglens-migrate
  namespace: loglens
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: 432995435807.dkr.ecr.ap-south-1.amazonaws.com/cu-final/backend:latest
          command: ["/bin/sh", "-c"]
          args:
            - python -c "from app.db import init_db; init_db()"
          envFrom:
            - secretRef:
                name: loglens-secrets