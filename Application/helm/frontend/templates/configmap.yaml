apiVersion: v1
kind: ConfigMap
metadata:
  name: loglens-frontend-nginx-config
  namespace: {{ .Values.namespace }}

data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      # Frontend health endpoint
      location /frontend-healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
      }

      # Proxy API requests to backend service
      location /api/ {
        proxy_pass http://{{ .Values.backend.serviceName }}:80/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Backend health endpoint
      location /healthz {
        proxy_pass http://{{ .Values.backend.serviceName }}:80/healthz;
        proxy_set_header Host $host;
      }

      # Metrics endpoint
      location /metrics {
        proxy_pass http://{{ .Values.backend.serviceName }}:80/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
      }

      # SPA routing
      location / {
        try_files $uri /index.html;
      }
    }
