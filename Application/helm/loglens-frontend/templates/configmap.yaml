apiVersion: v1
kind: ConfigMap
metadata:
  name: loglens-frontend-nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
      listen 5173;
      root /usr/share/nginx/html;
      index index.html;

      # Proxy API requests to the backend service in the cluster
      location /api/ {
        proxy_pass http://{{ .Values.backend.host }}:{{ .Values.backend.port }}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Health and metrics endpoints
      location /healthz {
        proxy_pass http://{{ .Values.backend.host }}:{{ .Values.backend.port }}/healthz;
      }
      location /metrics {
        proxy_pass http://{{ .Values.backend.host }}:{{ .Values.backend.port }}/metrics;
      }

      location / {
        try_files $uri /index.html;
      }
    }
